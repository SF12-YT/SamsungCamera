name: Temporary Samsung Gallery DEX inspection

on:
  push:
    branches:
      - temp/dex-gallery-inspect

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out APK contents
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JADX
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          api = "https://api.github.com/repos/skylot/jadx/releases/latest"
          req = urllib.request.Request(api, headers={"Accept": "application/vnd.github+json", "User-Agent": "dex-inspection"})
          with urllib.request.urlopen(req) as response:
              release = json.load(response)
          assets = [a for a in release.get("assets", []) if a["name"].startswith("jadx-") and a["name"].endswith(".zip") and "sources" not in a["name"].lower()]
          if not assets:
              raise SystemExit("No JADX release ZIP found")
          asset = sorted(assets, key=lambda a: len(a["name"]))[0]
          print("Downloading", asset["name"])
          urllib.request.urlretrieve(asset["browser_download_url"], "jadx.zip")
          PY
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile DEX files and collect Gallery references
        shell: bash
        run: |
          mkdir -p report
          for dex in classes.dex classes2.dex classes3.dex; do
            echo "Decompiling $dex"
            base=$(printf '%s' "$dex" | sed 's/\.dex$//')
            mkdir -p "out/$base"
            jadx/bin/jadx --show-bad-code -d "out/$base" "$dex" >"report/$dex.log" 2>&1 || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path("out")
          report = Path("report")
          patterns = [
              re.compile(r"com\.sec\.android\.gallery3d", re.I),
              re.compile(r"GalleryActivity|GalleryService|GalleryProvider", re.I),
              re.compile(r"bucketId|mediaTypes", re.I),
              re.compile(r"android\.intent\.action\.VIEW|ACTION_VIEW", re.I),
              re.compile(r"com\.sec\.android\.app\.camera", re.I),
              re.compile(r"content://media", re.I),
              re.compile(r"gallery", re.I),
          ]
          strong = patterns[:-1]
          seen = 0
          copied = 0
          lines_out = []
          for file in root.rglob("*.java"):
              try:
                  lines = file.read_text(errors="replace").splitlines()
              except Exception:
                  continue
              hits = [i for i, line in enumerate(lines) if any(p.search(line) for p in patterns)]
              if not hits:
                  continue
              rel = file.relative_to(root)
              lines_out.append(f"\n{'='*100}\nFILE: {rel}\n{'='*100}")
              windows = []
              for i in hits[:80]:
                  start, end = max(0, i-8), min(len(lines), i+10)
                  if windows and start <= windows[-1][1]:
                      windows[-1] = (windows[-1][0], max(windows[-1][1], end))
                  else:
                      windows.append((start, end))
              for start, end in windows:
                  lines_out.extend(f"{n+1:5}: {lines[n]}" for n in range(start, end))
                  lines_out.append("")
              seen += 1
              if copied < 25 and any(any(p.search(line) for p in strong) for line in lines):
                  dest = report / "related_sources" / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(file, dest)
                  copied += 1
              if sum(map(len, lines_out)) > 90000:
                  lines_out.append("\n[Output truncated at 90 KB]")
                  break
          focus_names = {"GalleryIntentHelper.java", "LatestMediaContent.java", "ImageUtils.java", "StorageUtils.java", "Constants.java", "PackageUtil.java"}
          for file in root.rglob("*.java"):
              if file.name in focus_names:
                  rel = file.relative_to(root)
                  dest = report / "focus_sources" / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(file, dest)
          (report / "gallery-hits.txt").write_text("\n".join(lines_out) if lines_out else "No Gallery-related strings found in JADX output.")
          (report / "source-summary.txt").write_text(
              f"Matched Java files: {seen}\nCopied related source files: {copied}\n"
              f"DEX input files: {', '.join(p.name for p in Path('.').glob('classes*.dex'))}\n"
          )
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: samsung-gallery-dex-inspection
          path: report/
          if-no-files-found: error
          retention-days: 3
